<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motions</title>
<style>
  :root {
    --bg: #fbfaf7; --panel: #ffffff; --ink: #1f1d1a; --muted: #6b6560;
    --line: #e6e1d8; --accent: #b8106b; --accent-soft: #fbe7f1;
    --human: #2a5d9f; --agent: #b8106b; --code: #f3efe8; --mention: #fff3c4;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px; line-height: 1.5; color: var(--ink); background: var(--bg);
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 14px; padding: 8px 18px;
    border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap;
  }
  header .brand { font-weight: 700; color: var(--accent); letter-spacing: .02em; }
  header .brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
  header .me { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  header select { font: inherit; font-size: 13px; padding: 2px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--ink); }
  header label.only { display: none; align-items: center; gap: 5px; font-size: 13px; color: var(--muted); cursor: pointer; }
  body.has-me header label.only { display: inline-flex; }
  header .status { margin-left: auto; font-size: 12px; color: var(--muted); }
  header .status.live::before { content: "●"; color: #2e9e5b; margin-right: 5px; }
  header .status.stale::before { content: "●"; color: #d08b00; margin-right: 5px; }

  .layout { flex: 1; display: flex; min-height: 0; }

  nav {
    width: var(--nav-width, 190px); flex: none; overflow-y: auto; background: var(--panel);
    border-right: 1px solid var(--line); padding: 10px 0;
  }
  nav .label { padding: 4px 16px 8px; font-size: 11px; text-transform: uppercase;
    letter-spacing: .08em; color: var(--muted); }
  nav a.motion {
    display: block; padding: 9px 16px; text-decoration: none; color: inherit;
    border-left: 3px solid transparent;
  }
  nav a.motion:hover { background: #f6f3ee; }
  nav a.motion.active { background: var(--accent-soft); border-left-color: var(--accent); }
  nav a.motion .title { font-weight: 600; display: flex; align-items: center; gap: 8px; }
  nav a.motion .meta { font-size: 12px; color: var(--muted); }
  /* Someone typing or an agent at work: their name pulses where the Motion is listed. */
  nav .nm.live { color: var(--ink); font-weight: 600; animation: pulse 1.2s ease-in-out infinite; }
  /* Drag the pane's edge to size it; the width is remembered in this browser. */
  #grip { width: 5px; margin-left: -3px; flex: none; cursor: col-resize; position: relative; z-index: 1; }
  #grip:hover, body.sizing #grip { background: var(--accent-soft); }
  body.sizing { cursor: col-resize; user-select: none; }
  .badge {
    display: inline-block; min-width: 18px; padding: 0 6px; border-radius: 9px;
    background: var(--accent); color: #fff; font-size: 11px; font-weight: 700;
    line-height: 18px; text-align: center;
  }

  main { flex: 1; min-width: 0; overflow-y: auto; padding: 22px 0 0; }  /* no bottom padding: it would hold the sticky footer off the bottom */
  .inner { max-width: 760px; margin: 0 auto; padding: 0 22px; }

  .motion-head h1 { font-size: 22px; margin: 0 0 4px; }
  .motion-head .desc { color: var(--muted); margin: 0 0 6px; }
  .motion-head .meta { font-size: 12px; color: var(--muted); }
  .motion-head { padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }

  .turn { padding: 12px 0 12px 10px; margin-left: -10px; border-top: 1px solid var(--line); border-left: 3px solid transparent; }
  #turns > .turn:first-child { border-top: 0; }
  /* The same sender again within minutes: one heading for the run. */
  .turn.cont { border-top: 0; padding-top: 0; }
  .turn.cont .who { display: none; }
  .turn.mentions-me { border-left-color: var(--accent); }
  body.only-mine .turn:not(.mentions-me) { display: none; }
  .turn .who { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  .turn .who .name { font-weight: 700; }
  .turn.human .who .name { color: var(--human); }
  .turn.agent .who .name { color: var(--agent); }
  .turn .who time { font-size: 12px; color: var(--muted); }
  .turn .who .how, .work .who .how { font-size: 11px; color: var(--muted); background: var(--code); border-radius: 8px; padding: 0 7px; }
  .turn .body > :first-child { margin-top: 0; }
  .turn .body > :last-child { margin-bottom: 0; }
  .turn .body p { margin: 0 0 .7em; }
  .turn .body ul, .turn .body ol { margin: 0 0 .7em; padding-left: 1.4em; }
  .turn .body h4 { margin: .8em 0 .3em; font-size: 15px; }
  .turn .body code { background: var(--code); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .turn .body pre { background: var(--code); padding: 10px 12px; border-radius: 6px; overflow-x: auto; font-size: 13px; }
  .turn .body pre code { background: none; padding: 0; }
  .turn .body table { border-collapse: collapse; margin: .4em 0 .8em; font-size: 14px; }
  .turn .body th, .turn .body td { border: 1px solid var(--line); padding: 4px 10px; text-align: left; vertical-align: top; }
  .turn .body th { background: var(--code); font-weight: 600; }
  .turn .body a { color: var(--human); }
  .turn .body a.wikilink { color: var(--accent); text-decoration: underline dotted; }
  .mention { background: var(--code); border-radius: 4px; padding: 0 4px; font-weight: 600; }
  .mention.me { background: var(--mention); }
  .turn.new { animation: arrive .6s ease-out; }
  @keyframes arrive { from { background: var(--accent-soft); } to { background: transparent; } }

  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  header .auth { font-size: 13px; color: var(--muted); }
  header .preview { font-size: 12px; font-weight: 600; color: #7a4b00; background: #ffe9b0; border-radius: 4px; padding: 1px 8px; }
  header .auth a { color: var(--muted); }
  #footer { position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); }
  #activity, #composer { max-width: 760px; margin: 0 auto; }  /* the reading column's width */
  #composer { display: none; position: relative; padding: 10px 16px 14px; }
  body.writer #composer { display: flex; gap: 8px; align-items: flex-end; }
  #composer textarea { flex: 1; font: inherit; min-height: 44px; max-height: 40vh; resize: vertical; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); }
  #composer button { font: inherit; padding: 8px 14px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; cursor: pointer; }
  #composer button:disabled { opacity: .5; cursor: default; }
  #composer .err { color: var(--accent); font-size: 12px; }
  #activity { display: none; align-items: center; gap: 8px; padding: 8px 16px; font-size: 13px; color: var(--muted); }
  #activity.on { display: flex; }
  #activity .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--agent); animation: pulse 1.2s ease-in-out infinite; }
  #activity b { color: var(--agent); }
  /* Held: owed a turn the runner isn't starting yet -- a still dot, not a pulse. */
  #activity.held .dot { animation: none; opacity: .35; }
  @keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
  .people { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .people .who { font-size: 12px; padding: 1px 8px; border-radius: 10px; background: var(--code); }
  .people .who.human { color: var(--human); }
  .people .who.agent { color: var(--agent); }
  .people .who.busy::after { content: ' ●'; animation: pulse 1.2s ease-in-out infinite; }
  /* Who is a person and who is an agent, wherever a name appears. */
  .ico { width: 13px; height: 13px; fill: currentColor; vertical-align: -1px; margin-right: 4px; flex: none; }
  .people .who.typing::after { content: ' typing…'; color: var(--muted); animation: pulse 1.2s ease-in-out infinite; }
  #tasks { display: none; flex-wrap: wrap; gap: 6px; padding: 6px 16px 0; font-size: 12.5px; color: var(--muted);
           max-width: 760px; margin: 0 auto; }
  #tasks.on { display: flex; }
  #tasks .task { background: var(--code); border-radius: 10px; padding: 1px 9px; }
  #tasks .sum { cursor: pointer; }
  #tasks .sum:hover { color: var(--ink); }
  #tasks .list { display: none; flex-wrap: wrap; gap: 6px; flex-basis: 100%; }
  #tasks.open .list { display: flex; }
  #tasks .task::before { content: '⚙ '; }
  #tasks .task.helper::before { content: '✦ '; }
  #typing { display: none; padding: 6px 16px 0; font-size: 13px; color: var(--muted); }
  #typing.on { display: block; }

  /* An agent's tool calls between its words: one line, opened on demand. */
  .work { margin: 2px 0 6px -10px; padding-left: 13px; }
  .work .who { display: flex; align-items: baseline; gap: 8px; margin: 10px 0 4px; }
  .work .who .name { font-weight: 700; color: var(--agent); }
  .work .who time { font-size: 12px; color: var(--muted); }
  .work.cont .who { display: none; }
  .work-head { font: inherit; font-size: 13px; color: var(--muted); background: none; border: 0; padding: 2px 0;
               cursor: pointer; text-align: left; }
  .work-head:hover { color: var(--ink); }
  .work-head .caret { display: inline-block; width: 1em; transition: transform .15s; }
  .work.open > .work-head .caret { transform: rotate(90deg); }
  .work .steps { display: none; margin: 4px 0 8px; border-left: 2px solid var(--line); padding-left: 10px; }
  .work.open .steps { display: block; }
  .step-head { font: inherit; font-size: 13px; background: none; border: 0; padding: 3px 0; cursor: pointer;
               text-align: left; color: var(--ink); display: flex; gap: 8px; width: 100%; align-items: baseline; }
  .step-head code { font-size: 12px; background: var(--code); padding: 0 5px; border-radius: 4px; color: var(--muted); flex: none; }
  .step-head .sum { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .step.err .step-head code { color: #b3261e; }
  .step-detail { display: none; margin: 4px 0 10px; }
  .step.open .step-detail { display: block; }
  .step-detail .label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 6px 0 2px; }
  .step-detail pre { margin: 0; background: #1e1d1b; color: #ece8e1; padding: 9px 11px; border-radius: 6px;
                     font-size: 12.5px; line-height: 1.45; max-height: 360px; overflow: auto; white-space: pre-wrap;
                     word-break: break-word; }
  .step-detail pre .del { color: #ff9b8f; }
  .step-detail pre .add { color: #9be59b; }
  .step-detail pre .dim { color: #9a948b; }
  .step-detail .err pre { box-shadow: inset 3px 0 0 #e5534b; }
  #earlier { display: block; margin: 6px auto 14px; font: inherit; font-size: 13px; color: var(--muted);
             background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 3px 14px; cursor: pointer; }
  body.only-mine .work { display: none; }
  /* An agent's choices not to speak: small dots, side by side. */
  .quiet { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 4px 0 4px -10px; padding: 4px 13px; }
  .quiet .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); border: 1px solid #d6cfc2;
                cursor: pointer; padding: 0; }
  .quiet .dot:hover, .quiet .dot.on { background: var(--agent); border-color: var(--agent); }
  /* The runner's quick screen let this pass; the agent itself never looked. */
  .quiet .dot.screened { background: transparent; border-style: dashed; }
  .quiet .dot.screened:hover, .quiet .dot.screened.on { background: transparent; border-color: var(--agent); }
  .quiet .why { flex-basis: 100%; font-size: 13px; color: var(--muted); font-style: italic; }
  body.only-mine .quiet { display: none; }
  /* Thinking the harness kept: dim, as a terminal shows it between tool calls. */
  .thought { margin: 2px 0 4px -10px; padding: 0 13px; font-size: 13.5px; font-style: italic; color: var(--muted);
             white-space: pre-wrap; }
  .thought::before { content: '∴ '; font-style: normal; }
  body.only-mine .thought { display: none; }
  /* Images: in turns, as thumbnails on a run of work, inside a step. */
  .turn .body a.img { display: inline-block; margin: 4px 0; }
  .turn .body img { display: block; max-width: 100%; max-height: 420px; border-radius: 6px; border: 1px solid var(--line); }
  .work .thumbs { display: flex; gap: 6px; flex-wrap: wrap; margin: 2px 0 4px; }
  .work .thumbs img, .step-detail .shots img { height: 84px; max-width: 160px; object-fit: cover; border-radius: 4px;
                                                border: 1px solid var(--line); cursor: zoom-in; }
  .step-detail .shots { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  #composer #attach {  /* beats #composer button, the Send style */
    font: inherit; font-size: 18px; line-height: 1; padding: 8px 10px; background: none; color: var(--muted);
            border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
  #composer #attach:hover { color: var(--ink); }
  #composer.dropping textarea { outline: 2px dashed var(--accent); }
  /* Whether each agent is listening here; a hush for a long deliberation. */
  .hush { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; font-size: 12.5px; color: var(--muted); }
  .hush select { font: inherit; font-size: 12.5px; padding: 1px 4px; border: 1px solid var(--line); border-radius: 4px;
                 background: var(--panel); color: var(--ink); }
  .hush .off { color: var(--accent); }
  #locked { display: none; background: #3a0d0d; color: #ffd9d9; padding: 8px 16px; font-size: 13.5px; }
  body.locked #locked { display: block; }
  body.locked #composer, body.locked #typing { display: none !important; }
  header a.settings { font-size: 13px; color: var(--muted); }
  #suggest { display: none; position: absolute; bottom: 100%; left: 16px; margin-bottom: 4px; background: var(--panel);
             border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 4px 14px rgba(0,0,0,.08); min-width: 180px; z-index: 5; }
  #suggest.on { display: block; }
  #suggest div { padding: 5px 10px; cursor: pointer; font-size: 14px; }
  #suggest div.sel, #suggest div:hover { background: var(--accent-soft); }
  #suggest small { color: var(--muted); margin-left: 6px; }
  #suggest .emo { display: inline-block; width: 1.6em; font-size: 16px; }
  #menu { display: none; font: inherit; font-size: 20px; line-height: 1; background: none; border: 0;
          color: var(--muted); cursor: pointer; padding: 0 2px; }
  @media (max-width: 720px) {
    header { flex-wrap: nowrap; gap: 8px; padding: 6px 12px; }
    header .brand small { display: none; }
    header .preview { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
    #menu { display: block; }
    header .me, header label.only, header .auth { display: none !important; }
    body.menu-open header { flex-wrap: wrap; }
    body.menu-open header .me, body.menu-open header .auth { display: inline-flex !important; }
    body.menu-open.has-me header label.only { display: inline-flex !important; }
    .layout { flex-direction: column; }
    nav, #grip { display: none; }
    body.menu-open nav { display: block; width: auto; max-height: 40vh; border-right: 0; border-bottom: 1px solid var(--line); }
    main { padding-top: 12px; }
    .inner { padding: 0 12px; }
    .motion-head h1 { font-size: 19px; }
    #activity { padding: 6px 12px; }
    #composer { padding: 8px 10px 10px; }
  }
  /* Signed in, you are who you are: no need to choose whose view to see. */
  body.writer header .me { display: none !important; }
</style>
</head>
<body>
<header>
  <span class="brand">Motions<small>memory-lane</small></span>
  <a class="settings" href="/motions/settings/" title="How each agent carries itself in each Motion">settings</a>
  {% if preview_label %}<span class="preview" title="A branch's code, not production; see the label for which record">{{ preview_label }}</span>{% endif %}
  <span class="me">viewing as <select id="me"><option value="">nobody</option></select></span>
  <label class="only"><input type="checkbox" id="onlyMine"> only mentions of me</label>
  <span class="auth" id="auth"></span>
  <span class="status" id="status">connecting…</span>
  <button id="menu" type="button" aria-label="Menu" aria-expanded="false">☰</button>
</header>
<div id="locked"></div>
<div class="layout">
  <nav id="nav"><div class="label">Motions</div></nav>
  <div id="grip" title="Drag to resize; double-click to reset"></div>
  <main id="main"><div class="inner" id="inner"><div class="empty">Loading…</div></div>
    <div id="footer">
    <div id="typing"></div>
    <div id="tasks"></div>
    <div id="activity"><span class="dot"></span><span id="activityText"></span></div>
    <form id="composer" autocomplete="off">
      <div id="suggest"></div>
      <button type="button" id="attach" title="Add an image (or paste or drop one)" aria-label="Add an image">＋</button>
      <input type="file" id="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>
      <textarea id="say" placeholder="Say something. @name to address someone; [[Page]] links PickiPedia. Enter sends; Ctrl+Enter for a new line." rows="2"></textarea>
      <button type="submit" id="send">Send</button>
    </form>
    </div>
  </main>
</div>

<script>
(function () {
  const POLL_MS = 4000;
  const initialSlug = "{{ initial_slug|escapejs }}" || null;
  const nav = document.getElementById('nav');
  const inner = document.getElementById('inner');
  const main = document.getElementById('main');
  const status = document.getElementById('status');
  const meSelect = document.getElementById('me');
  const onlyMine = document.getElementById('onlyMine');
  // Signed in only if this browser was enrolled with an SSH key; see
  // services/motion_auth.py. Reading never needs it.
  const viewer = "{{ viewer|escapejs }}" || null;
  const auth = document.getElementById('auth');
  const composer = document.getElementById('composer');
  const sayBox = document.getElementById('say');
  const sendBtn = document.getElementById('send');

  // Who is looking. Lives in the browser: the view has no accounts, and a
  // filter is not a permission. Everything here stays readable to anyone.
  const store = {
    get(k, d) { try { const v = localStorage.getItem('motions.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('motions.' + k, JSON.stringify(v)); } catch (e) {} },
  };

  let motions = [];
  let names = new Set();
  let current = null;       // slug
  let lastId = null;        // last turn id rendered, for ?after=
  let me = viewer || store.get('me', '') || '';
  let lastSeen = store.get('lastSeen', {});   // slug -> iso
  let badges = {};          // slug -> count of my mentions since lastSeen
  let baseTitle = 'Motions';
  let people = [];          // everyone who can be named, for @-completion
  let human = {};           // name -> is a person
  let act = null;           // what an agent is doing now, from /turns/
  let typingNow = [];       // who else is typing here, from /turns/

  const ICONS = {
    human: '<svg class="ico" viewBox="0 0 16 16" aria-label="person"><circle cx="8" cy="4.6" r="3"/><path d="M2.2 15c0-3.4 2.6-5.6 5.8-5.6s5.8 2.2 5.8 5.6z"/></svg>',
    agent: '<svg class="ico" viewBox="0 0 16 16" aria-label="agent"><circle cx="8" cy="1.8" r="1.2"/><rect x="7.4" y="2" width="1.2" height="2.6"/><rect x="2.5" y="4.4" width="11" height="9.2" rx="2.4"/><rect x="0.6" y="7.6" width="1.4" height="3" rx=".6"/><rect x="14" y="7.6" width="1.4" height="3" rx=".6"/><circle cx="5.9" cy="8.6" r="1.25" fill="#fff"/><circle cx="10.1" cy="8.6" r="1.25" fill="#fff"/><rect x="5.6" y="11.1" width="4.8" height="1" rx=".5" fill="#fff"/></svg>',
  };
  function icon(name, isHuman) {
    const h = isHuman === undefined ? !!human[name] : isHuman;
    return h ? ICONS.human : ICONS.agent;
  }

  // Which model, at what effort, an agent's turn ran on.
  function how(item) {
    const bits = [item.model, item.effort].filter(Boolean);
    return bits.length ? `<span class="how" title="model · effort">${esc(bits.join(' · '))}</span>` : '';
  }

  function setStatus(text, cls) { status.textContent = text; status.className = 'status ' + (cls || ''); }
  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function ago(iso) {
    if (!iso) return 'never';
    const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s / 60) + 'm ago';
    if (s < 86400) return Math.floor(s / 3600) + 'h ago';
    return Math.floor(s / 86400) + 'd ago';
  }
  function stamp(iso) {
    return new Date(iso).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  }
  function setTitle() {
    const n = Object.values(badges).reduce((a, b) => a + b, 0);
    document.title = (n ? '(' + n + ') ' : '') + baseTitle;
  }

  function renderNav() {
    const items = motions.map(m => `
      <a class="motion ${m.slug === current ? 'active' : ''}" href="/motions/${encodeURIComponent(m.slug)}/" data-slug="${esc(m.slug)}">
        <div class="title">${esc(m.title)}${badges[m.slug] ? `<span class="badge">${badges[m.slug]}</span>` : ''}</div>
        <div class="meta">${m.participants.map(n => `<span class="nm" data-who="${esc(n)}">${esc(n)}</span>`).join(', ') || '—'} · ${m.message_count} · ${ago(m.last_at)}</div>
      </a>`).join('');
    nav.innerHTML = '<div class="label">Motions</div>' + items;
    markLive();
  }

  // Pulse the names of whoever is typing or at work in the open Motion.
  function markLive() {
    const live = new Set(typingNow);
    if (act && act.doing !== 'held') live.add(act.agent);  // held isn't busy
    nav.querySelectorAll('a.motion.active .nm').forEach(el => el.classList.toggle('live', live.has(el.dataset.who)));
  }

  const grip = document.getElementById('grip');
  const NAV_MIN = 140, NAV_MAX = 480;
  function navWidth(w) {
    if (w) document.documentElement.style.setProperty('--nav-width', Math.max(NAV_MIN, Math.min(NAV_MAX, w)) + 'px');
    else document.documentElement.style.removeProperty('--nav-width');
  }
  navWidth(store.get('navWidth', 0));
  grip.addEventListener('pointerdown', e => {
    e.preventDefault();
    grip.setPointerCapture(e.pointerId);
    document.body.classList.add('sizing');
  });
  grip.addEventListener('pointermove', e => {
    if (document.body.classList.contains('sizing')) navWidth(e.clientX - nav.getBoundingClientRect().left);
  });
  grip.addEventListener('pointerup', () => {
    document.body.classList.remove('sizing');
    store.set('navWidth', Math.round(nav.getBoundingClientRect().width));
  });
  grip.addEventListener('dblclick', () => { navWidth(0); store.set('navWidth', 0); });

  function renderMe() {
    const opts = ['<option value="">nobody</option>'].concat(
      [...names].sort().map(n => `<option value="${esc(n)}" ${n === me ? 'selected' : ''}>${esc(n)}</option>`));
    meSelect.innerHTML = opts.join('');
    document.body.classList.toggle('has-me', !!me);
    if (!me) { onlyMine.checked = false; document.body.classList.remove('only-mine'); }
  }

  function markTurn(el, mentions) {
    el.classList.toggle('mentions-me', !!me && mentions.includes(me));
    el.querySelectorAll('.mention').forEach(s => s.classList.toggle('me', s.dataset.who === me));
  }

  function renderHead(m) {
    const block = m.eth_blockheight ? 'opened at block ' + m.eth_blockheight.toLocaleString() : '';
    return `<div class="motion-head">
      <h1>${esc(m.title)}</h1>
      ${m.description ? `<p class="desc">${esc(m.description)}</p>` : ''}
      <div class="meta">${block ? block + ' · ' : ''}${m.message_count} messages in the record</div>
      <div class="people" id="people">${m.participants.map(n =>
        `<span class="who ${human[n] ? 'human' : 'agent'}" data-who="${esc(n)}">${icon(n)}${esc(n)}</span>`).join('')}</div>
      <div class="hush" id="hush"></div>
    </div><button id="earlier" type="button" hidden>Load earlier</button><div id="turns"></div>`;
  }

  const RUN_MS = 5 * 60 * 1000;  // the same sender within this is one run
  let prev = null;               // the last turn rendered: {sender, at}

  function turnEl(t, isNew) {
    const el = document.createElement('article');
    const at = new Date(t.created_at).getTime();
    const cont = prev && prev.sender === t.sender && at - prev.at < RUN_MS;
    prev = { sender: t.sender, at };
    el.className = 'turn ' + (t.is_human ? 'human' : 'agent') + (cont ? ' cont' : '') + (isNew ? ' new' : '');
    if (cont) el.title = t.sender + ' · ' + stamp(t.created_at);
    el.dataset.mentions = JSON.stringify(t.mentions || []);
    el.innerHTML = `<div class="who"><span class="name">${icon(t.sender, t.is_human)}${esc(t.sender)}</span><time datetime="${t.created_at}">${stamp(t.created_at)}</time>${how(t)}</div><div class="body">${t.html}</div>`;
    markTurn(el, t.mentions || []);
    return el;
  }

  // --- tool steps: grouped into one collapsed line per run of work ----------
  function workEl(s, container) {
    const last = container.lastElementChild;
    if (last && last.classList.contains('work') && last.dataset.sender === s.sender) return last;
    const at = new Date(s.created_at).getTime();
    const cont = prev && prev.sender === s.sender && at - prev.at < RUN_MS;
    const el = document.createElement('div');
    el.className = 'work' + (cont ? ' cont' : '');
    el.dataset.sender = s.sender;
    el.innerHTML = `<div class="who"><span class="name">${icon(s.sender, false)}${esc(s.sender)}</span><time datetime="${esc(s.created_at)}">${stamp(s.created_at)}</time>${how(s)}</div>`
      + `<button class="work-head" type="button"><span class="caret">▸</span><span class="what"></span></button><div class="steps"></div>`;
    container.appendChild(el);
    return el;
  }
  function describeWork(el) {
    const counts = {};
    el.querySelectorAll('.step').forEach(s => { counts[s.dataset.verb] = (counts[s.dataset.verb] || 0) + 1; });
    const n = el.querySelectorAll('.step').length;
    const parts = Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([v, c]) => c > 1 ? `${v} ×${c}` : v);
    el.querySelector('.what').textContent = `${n} step${n === 1 ? '' : 's'} · ${parts.join(', ')}`;
  }
  function addStep(s, container) {
    const work = workEl(s, container);
    const row = document.createElement('div');
    row.className = 'step';
    row.dataset.id = s.id; row.dataset.verb = s.verb;
    row.innerHTML = `<button class="step-head" type="button"><code>${esc(s.tool.replace(/^mcp__/, ''))}</code><span class="sum">${esc(s.summary || s.verb)}</span></button><div class="step-detail"></div>`;
    work.querySelector('.steps').appendChild(row);
    if (s.images && s.images.length) {
      let thumbs = work.querySelector('.thumbs');
      if (!thumbs) {
        thumbs = document.createElement('div'); thumbs.className = 'thumbs';
        work.insertBefore(thumbs, work.querySelector('.steps'));
      }
      for (const url of s.images) thumbs.insertAdjacentHTML('beforeend', `<a href="${esc(url)}" target="_blank" rel="noopener"><img src="${esc(url)}" alt="from ${esc(s.tool)}" loading="lazy"></a>`);
    }
    describeWork(work);
    prev = { sender: s.sender, at: new Date(s.created_at).getTime() };
  }
  function pre(text, cls) { return `<pre${cls ? ` class="${cls}"` : ''}>${esc(text)}</pre>`; }
  function diff(oldText, newText) {
    const lines = [];
    String(oldText || '').split('\n').forEach(l => lines.push(`<span class="del">- ${esc(l)}</span>`));
    String(newText || '').split('\n').forEach(l => lines.push(`<span class="add">+ ${esc(l)}</span>`));
    return `<pre>${lines.join('\n')}</pre>`;
  }
  function renderDetail(d) {
    const a = d.input || {};
    let ask = '';
    if (d.tool === 'Bash') ask = `<pre><span class="dim">$ </span>${esc(a.command || '')}</pre>`;
    else if (d.tool === 'Edit') ask = `<div class="label">${esc(a.file_path || '')}</div>` + diff(a.old_string, a.new_string);
    else if (d.tool === 'Write') ask = `<div class="label">${esc(a.file_path || '')}</div>` + pre(a.content || '');
    else ask = pre(JSON.stringify(a, null, 2));
    let out = '';
    if (d.result) {
      const shots = (d.result.text || '').match(/\/motions\/media\/[0-9a-f]{64}\.(?:png|jpg|gif|webp)/g) || [];
      const text = (d.result.text || '').replace(/!\[[^\]]*\]\(\/motions\/media\/[^)]+\)\n?/g, '').trim() || (shots.length ? '' : '(no output kept)');
      out = `<div class="${d.result.is_error ? 'err' : ''}"><div class="label">${d.result.is_error ? 'error' : 'result'}</div>${text ? pre(text) : ''}`
        + (shots.length ? `<div class="shots">${shots.map(u => `<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="" loading="lazy"></a>`).join('')}</div>` : '')
        + `</div>`;
    }
    const heading = ['Edit', 'Write'].includes(d.tool) ? '' : `<div class="label">${esc(d.verb)}</div>`;
    return heading + ask + out;
  }
  document.addEventListener('click', async e => {
    const head = e.target.closest('.work-head');
    if (head) { head.parentElement.classList.toggle('open'); return; }
    const stepHead = e.target.closest('.step-head');
    if (!stepHead) return;
    const step = stepHead.parentElement;
    step.classList.toggle('open');
    const box = step.querySelector('.step-detail');
    if (!step.classList.contains('open') || box.dataset.loaded) return;
    box.textContent = 'loading…';
    try {
      const r = await fetch(`/api/motions/${encodeURIComponent(current)}/steps/${encodeURIComponent(step.dataset.id)}/`);
      if (!r.ok) throw new Error(r.status);
      const d = await r.json();
      box.innerHTML = renderDetail(d);
      box.dataset.loaded = '1';
      if (d.result && d.result.is_error) step.classList.add('err');
    } catch (err) { box.textContent = 'could not load this step'; }
  });

  function addThought(t, container) {
    const el = document.createElement('div');
    el.className = 'thought';
    el.title = `${t.sender} thinking · ${stamp(t.created_at)}`;
    el.textContent = t.text;
    container.appendChild(el);
    prev = { sender: t.sender, at: new Date(t.created_at).getTime() };
  }

  function addQuiet(q, container) {
    let row = container.lastElementChild;
    if (!row || !row.classList.contains('quiet')) {
      row = document.createElement('div'); row.className = 'quiet';
      container.appendChild(row);
    }
    const dot = document.createElement('button');
    dot.type = 'button'; dot.className = 'dot' + (q.by === 'screen' ? ' screened' : '');
    dot.title = q.by === 'screen'
      ? `screened for ${q.sender}: let pass without waking it · ${stamp(q.created_at)}`
      : `${q.sender} chose not to speak · ${stamp(q.created_at)}`;
    dot.dataset.why = q.reason || '(no reason given)';
    row.appendChild(dot);
  }
  document.addEventListener('click', e => {
    const dot = e.target.closest('.quiet .dot');
    if (!dot) return;
    const row = dot.parentElement;
    const wasOn = dot.classList.contains('on');
    row.querySelectorAll('.dot').forEach(d => d.classList.remove('on'));
    let why = row.querySelector('.why');
    if (wasOn) { if (why) why.remove(); return; }
    dot.classList.add('on');
    if (!why) { why = document.createElement('div'); why.className = 'why'; row.appendChild(why); }
    why.textContent = dot.title + ': ' + dot.dataset.why;
  });

  // Turns, steps and dots from one response, in the order they happened.
  function itemsOf(data) {
    return [...(data.turns || []).map(t => ({ kind: 'turn', v: t })), ...(data.steps || []).map(s => ({ kind: 'step', v: s })),
            ...(data.quiet || []).map(q => ({ kind: 'quiet', v: q })),
            ...(data.thoughts || []).map(t => ({ kind: 'thought', v: t }))]
      .sort((a, b) => a.v.created_at < b.v.created_at ? -1 : a.v.created_at > b.v.created_at ? 1 : 0);
  }
  function renderItems(items, container, isNew) {
    for (const it of items) {
      if (it.kind === 'turn') container.appendChild(turnEl(it.v, isNew));
      else if (it.kind === 'quiet') addQuiet(it.v, container);
      else if (it.kind === 'thought') addThought(it.v, container);
      else addStep(it.v, container);
    }
  }

  function remarkAll() {
    document.querySelectorAll('.turn').forEach(el => markTurn(el, JSON.parse(el.dataset.mentions || '[]')));
  }

  async function loadMotions() {
    const r = await fetch('/api/motions/');
    if (!r.ok) throw new Error('motions ' + r.status);
    const body = await r.json();
    motions = body.motions;
    people = body.people || [];
    people.forEach(p => { human[p.name] = p.is_human; });
    motions.forEach(m => m.participants.forEach(p => names.add(p)));
    renderMe();
    renderNav();
  }

  async function refreshBadges() {
    badges = {};
    if (!me) { renderNav(); setTitle(); return; }
    // Look back as far as the oldest lastSeen we have, else a week.
    const seen = Object.values(lastSeen).sort();
    const since = seen[0] || new Date(Date.now() - 7 * 86400 * 1000).toISOString();
    try {
      const r = await fetch('/api/mentions/' + encodeURIComponent(me) + '/?since=' + encodeURIComponent(since) + '&limit=200');
      if (!r.ok) return;
      for (const m of (await r.json()).mentions) {
        if (m.motion === current) continue;
        const floor = lastSeen[m.motion];
        if (!floor || m.turn.created_at > floor) badges[m.motion] = (badges[m.motion] || 0) + 1;
      }
    } catch (e) {}
    renderNav(); setTitle();
  }

  function touch(slug) {
    lastSeen[slug] = new Date().toISOString();
    store.set('lastSeen', lastSeen);
    if (badges[slug]) { delete badges[slug]; renderNav(); setTitle(); }
  }

  async function open(slug, push) {
    current = slug; lastId = null;
    if (push) history.pushState({ slug }, '', '/motions/' + encodeURIComponent(slug) + '/');
    touch(slug);
    renderNav();
    inner.innerHTML = '<div class="empty">Loading…</div>';
    await poll(true);
  }

  let firstId = null;      // the oldest item shown, for ?before=
  async function loadEarlier() {
    const button = document.getElementById('earlier');
    if (!firstId || !button) return;
    button.disabled = true; button.textContent = 'loading…';
    try {
      const r = await fetch('/api/motions/' + encodeURIComponent(current) + '/turns/?before=' + firstId);
      const data = await r.json();
      const items = itemsOf(data);
      const box = document.createElement('div');
      const saved = prev; prev = null;
      renderItems(items, box, false);
      prev = saved;
      const turnsEl = document.getElementById('turns');
      const height = main.scrollHeight;
      turnsEl.prepend(...box.children);
      main.scrollTop += main.scrollHeight - height;
      if (items.length) firstId = items[0].v.id;
      button.hidden = !data.has_earlier;
    } finally { button.disabled = false; button.textContent = 'Load earlier'; }
  }
  document.addEventListener('click', e => { if (e.target.id === 'earlier') loadEarlier(); });

  async function poll(full) {
    if (!current) return;
    const url = '/api/motions/' + encodeURIComponent(current) + '/turns/' + (lastId && !full ? '?after=' + lastId : '');
    let data;
    try {
      const r = await fetch(url);
      if (!r.ok) throw new Error(r.status);
      data = await r.json();
      setStatus('live', 'live');
    } catch (e) {
      setStatus('reconnecting…', 'stale');
      return;
    }
    if (full) {
      prev = null;
      inner.innerHTML = renderHead(data.motion);
      baseTitle = data.motion.title + ' · Motions';
      setTitle();
    }
    act = data.activity || null;
    renderActivity();
    tasks = data.tasks || [];
    renderTasks();
    renderHush(data.listening || {});
    renderLocked(data.scram || null);
    typingNow = (data.typing || []).filter(n => n !== viewer);
    renderTyping();
    const turnsEl = document.getElementById('turns');
    if (!turnsEl) return;
    const items = itemsOf(data);
    if (full) {
      firstId = items.length ? items[0].v.id : null;
      const earlier = document.getElementById('earlier');
      earlier.hidden = !data.has_earlier;
      if (!items.length) turnsEl.innerHTML = '<div class="empty">Nothing said here yet.</div>';
    }
    if (items.length) {
      const nearBottom = main.scrollHeight - main.scrollTop - main.clientHeight < 120;
      const emptyNote = turnsEl.querySelector('.empty'); if (emptyNote) emptyNote.remove();
      renderItems(items, turnsEl, !full);
      lastId = items[items.length - 1].v.id;
      if (full || nearBottom) main.scrollTop = main.scrollHeight;
      touch(current);
      if (!full && data.turns.length) { await loadMotions(); }
    }
    await refreshBadges();
  }

  // --- what an agent is doing: read from the record, ticking locally ----------
  const activityEl = document.getElementById('activity');
  const activityText = document.getElementById('activityText');
  function elapsed(since) {
    const s = Math.max(0, Math.floor(Date.now() / 1000 - since));
    if (s < 60) return s + 's';
    if (s < 3600) return Math.floor(s / 60) + 'm ' + String(s % 60).padStart(2, '0') + 's';
    return Math.floor(s / 3600) + 'h ' + String(Math.floor(s % 3600 / 60)).padStart(2, '0') + 'm';
  }
  // --- listening: hush an agent here, for a while or until changed ----------
  const HUSH = [['on', 0, 'listening'], ['mentions', 60, 'mentions only · 1 hour'],
                ['mentions', 0, 'mentions only · until changed'], ['off', 60, 'hushed · 1 hour'],
                ['off', 120, 'hushed · 2 hours'], ['off', 0, 'hushed · until changed']];
  let hushShown = '';
  function describeListening(l) {
    const until = l.until ? ' until ' + new Date(l.until).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' }) : '';
    return l.mode === 'on' ? 'listening' : (l.mode === 'mentions' ? 'mentions only' : 'hushed') + until;
  }
  function renderHush(listening) {
    const box = document.getElementById('hush');
    if (!box) return;
    const key = JSON.stringify(listening);
    if (key === hushShown && box.childElementCount) return;  // don't reset a menu someone has open
    hushShown = key;
    box.innerHTML = Object.entries(listening).map(([agent, l]) => {
      const now = `<option selected disabled>${esc(describeListening(l))}</option>`;
      const choices = HUSH.map(([mode, minutes, label], i) => `<option value="${i}">${esc(label)}</option>`).join('');
      return `<span class="${l.mode === 'on' ? '' : 'off'}">${icon(agent, false)}${esc(agent)}: `
        + (viewer ? `<select data-agent="${esc(agent)}">${now}${choices}</select>` : esc(describeListening(l))) + '</span>';
    }).join('');
  }
  document.addEventListener('change', async e => {
    const select = e.target.closest('#hush select');
    if (!select) return;
    const [mode, minutes] = HUSH[Number(select.value)];
    const until = minutes ? new Date(Date.now() + minutes * 60000).toISOString() : null;
    const r = await fetch('/api/settings/', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrf() },
      body: JSON.stringify({ key: 'listening', value: { mode, until }, motion: current, agent: select.dataset.agent,
                             note: 'from the Motion' }),
    });
    if (!r.ok) showError('hush: ' + ((await r.json().catch(() => ({}))).error || r.status));
    hushShown = '';
    poll(false);
  });
  function renderLocked(scram) {
    document.body.classList.toggle('locked', !!scram);
    document.getElementById('locked').textContent = scram
      ? `Locked: AZ5 by ${scram.by} at ${new Date(scram.at).toLocaleString()}. Nobody can post or sign in, and every agent is still, until it's lifted.`
      : '';
  }

  // What an agent left running in the background, as in its terminal.
  let tasks = [];
  const tasksEl = document.getElementById('tasks');
  // One line -- how many, and the longest-running -- opened on demand.
  function renderTasks() {
    tasksEl.classList.toggle('on', tasks.length > 0);
    if (!tasks.length) { tasksEl.innerHTML = ''; return; }
    const oldest = Math.min(...tasks.map(t => t.since));
    tasksEl.innerHTML = `<span class="sum" title="show them">⚙ ${tasks.length} running · longest ${elapsed(oldest)} ${tasksEl.classList.contains('open') ? '▾' : '▸'}</span>`
      + `<span class="list">${tasks.map(t =>
        `<span class="task ${t.kind === 'helper' ? 'helper' : ''}" title="${esc(t.kind)} ${esc(t.id)}">${esc(t.label)} · ${elapsed(t.since)}</span>`).join('')}</span>`;
  }
  tasksEl.addEventListener('click', e => {
    if (e.target.closest('.sum')) { tasksEl.classList.toggle('open'); renderTasks(); }
  });
  setInterval(renderTasks, 1000);

  const typingEl = document.getElementById('typing');
  function renderTyping() {
    document.querySelectorAll('.people .who').forEach(el => el.classList.toggle('typing', typingNow.includes(el.dataset.who)));
    typingEl.classList.toggle('on', typingNow.length > 0);
    typingEl.innerHTML = typingNow.map(n => `${icon(n, true)}<b>${esc(n)}</b>`).join(', ')
      + (typingNow.length ? (typingNow.length > 1 ? ' are typing…' : ' is typing…') : '');
    markLive();
  }

  function renderActivity() {
    document.querySelectorAll('.people .who').forEach(el => el.classList.toggle('busy', !!act && act.doing !== 'held' && el.dataset.who === act.agent));
    activityEl.classList.toggle('on', !!act);
    activityEl.classList.toggle('held', !!act && act.doing === 'held');
    markLive();
    if (!act) return;
    const hhmm = iso => new Date(iso).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
    activityText.innerHTML = act.doing === 'waking'
      ? `waking ${icon(act.agent, false)}<b>${esc(act.agent)}</b> · ${elapsed(act.since)}`
      : act.doing === 'held'
      ? `${icon(act.agent, false)}<b>${esc(act.agent)}</b> · held: ${esc(act.why || 'not yet')}`
        + (act.until ? ` · answers about ${esc(hhmm(act.until))}` : '') + ` · asked ${elapsed(act.since)} ago`
      : `${icon(act.agent, false)}<b>${esc(act.agent)}</b> · ${esc(act.doing)} · ${elapsed(act.since)}`
        + ([act.model, act.effort].filter(Boolean).length ? ` · ${esc([act.model, act.effort].filter(Boolean).join(' · '))}` : '');
  }
  setInterval(renderActivity, 1000);

  // --- @-completion: people in this Motion first, then everyone else -------

    ['no_bell', '🔕'], ['hourglass', '⏳'], ['clock', '🕐'], ['calendar', '📅'], ['pin', '📌'], ['gear', '⚙️'],
    ['wrench', '🔧'], ['hammer', '🔨'], ['bug', '🐛'], ['robot', '🤖'], ['brain', '🧠'], ['computer', '💻'],
    ['phone', '📱'], ['camera', '📷'], ['movie', '🎬'], ['headphones', '🎧'], ['radio', '📻'], ['cd', '💿'],
    ['ticket', '🎫'], ['trophy', '🏆'], ['medal', '🏅'], ['gift', '🎁'], ['balloon', '🎈'], ['cake', '🎂'],
    ['pizza', '🍕'], ['taco', '🌮'], ['apple', '🍎'], ['peach', '🍑'], ['dog', '🐶'], ['cat', '🐱'],
    ['horse', '🐴'], ['turtle', '🐢'], ['snake', '🐍'], ['bird', '🐦'], ['owl', '🦉'], ['frog', '🐸'],
    ['crab', '🦀'], ['dragon', '🐉'], ['unicorn', '🦄'], ['bee', '🐝'], ['butterfly', '🦋'], ['moneybag', '💰'],
    ['chart', '📈'], ['ghost', '👻'], ['skull', '💀'], ['alien', '👽'], ['magenta', '🟣'], ['purple_heart', '💜'],
  ];
  // [[ suggests PickiPedia titles, as the wiki's own editor does (LinkSuggest).
  // Its API answers any origin, so the browser asks the wiki directly.
  const WIKI = "{{ pickipedia_url|escapejs }}" || 'https://pickipedia.xyz';
  const wikiCache = new Map();
  let wikiTimer = null;
  function titleCase(s) { return s.replace(/(^|[\s:_(-])([a-z])/g, (m, p, c) => p + c.toUpperCase()); }
  async function wikiTitles(prefix) {
    if (wikiCache.has(prefix)) return wikiCache.get(prefix);
    const ask = async q => {
      const r = await fetch(`${WIKI}/api.php?action=query&list=prefixsearch&pslimit=8&format=json&origin=*&pssearch=${encodeURIComponent(q)}`);
      return ((await r.json()).query || {}).prefixsearch || [];
    };
    let hits = [];
    try {
      hits = await ask(prefix);
      // Titles are case-sensitive after the first letter: 'tony r' finds
      // nothing, 'Tony R' finds Tony Rice.
      if (!hits.length && titleCase(prefix) !== prefix) hits = await ask(titleCase(prefix));
    } catch (e) { hits = []; }
    const titles = hits.map(h => h.title);
    wikiCache.set(prefix, titles);
    return titles;
  }

  function wordAtCaret() {
    const upto = sayBox.value.slice(0, sayBox.selectionStart);
    const w = upto.match(/\[\[([^\[\]|\n]{1,100})$/);
    if (w) return { kind: 'wiki', start: upto.length - w[1].length, prefix: w[1] };
    let m = upto.match(/(^|[^\w@\/.])@([A-Za-z][\w.-]*)?$/);
    if (m) return { kind: 'mention', start: upto.length - (m[2] || '').length, prefix: (m[2] || '').toLowerCase() };
    // `:` starting a word -- so 10:30 doesn't open it.
    m = upto.match(/(^|[\s(]):([a-z0-9_+-]{0,30})$/);
    if (m) return { kind: 'emoji', start: upto.length - m[2].length - 1, prefix: m[2] };
    return null;
  }
  function closeSuggest() { suggest.classList.remove('on'); choices = []; }
  function showSuggest() {
    const at = wordAtCaret();
    if (!at) return closeSuggest();
    if (at.kind === 'wiki') {
      clearTimeout(wikiTimer);
      const prefix = at.prefix;
      wikiTimer = setTimeout(async () => {
        const titles = await wikiTitles(prefix);
        const still = wordAtCaret();
        if (!still || still.kind !== 'wiki' || still.prefix !== prefix) return;  // they've typed on
        choices = titles.map(t => ({ insert: t + ']]', html: `<span class="emo">📖</span>${esc(t)}` }));
        if (!choices.length) return closeSuggest();
        chosen = Math.min(chosen, choices.length - 1);
        suggest.innerHTML = choices.map((c, i) => `<div class="${i === chosen ? 'sel' : ''}" data-i="${i}">${c.html}</div>`).join('');
        suggest.classList.add('on');
      }, wikiCache.has(prefix) ? 0 : 150);
      return;
    }
    if (at.kind === 'emoji') {
      const hits = EMOJI.filter(([name]) => name.startsWith(at.prefix))
        .concat(at.prefix ? EMOJI.filter(([name]) => !name.startsWith(at.prefix) && name.includes(at.prefix)) : [])
        .slice(0, 8);
      choices = hits.map(([name, char]) => ({ insert: char, html: `<span class="emo">${char}</span>:${esc(name)}:` }));
    } else {
      const here = new Set((motions.find(m => m.slug === current) || {}).participants || []);
      choices = people.map(p => p.name).filter(n => n.startsWith(at.prefix))
        .sort((a, b) => (here.has(b) - here.has(a)) || a.localeCompare(b)).slice(0, 8)
        .map(n => ({ insert: n + ' ', html: `${icon(n)}@${esc(n)}<small>${human[n] ? 'person' : 'agent'}${here.has(n) ? '' : ' · not here yet'}</small>` }));
    }
    if (!choices.length) return closeSuggest();
    chosen = Math.min(chosen, choices.length - 1);
    suggest.innerHTML = choices.map((c, i) => `<div class="${i === chosen ? 'sel' : ''}" data-i="${i}">${c.html}</div>`).join('');
    suggest.classList.add('on');
  }
  function acceptSuggest(i) {
    const at = wordAtCaret(); if (!at || !choices[i]) return;
    const before = sayBox.value.slice(0, at.start), after = sayBox.value.slice(sayBox.selectionStart);
    sayBox.value = before + choices[i].insert + after;
    const caret = (before + choices[i].insert).length;
    sayBox.setSelectionRange(caret, caret);
    closeSuggest(); sayBox.focus();
  }
  sayBox.addEventListener('input', () => { chosen = 0; showSuggest(); });
  sayBox.addEventListener('keydown', e => {
    if (!suggest.classList.contains('on')) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); chosen = (chosen + (e.key === 'ArrowDown' ? 1 : choices.length - 1)) % choices.length; showSuggest();
    } else if ((e.key === 'Enter' && !e.ctrlKey && !e.metaKey) || e.key === 'Tab') {
      e.preventDefault(); e.stopImmediatePropagation(); acceptSuggest(chosen);
      return;
    } else if (e.key === 'Escape') { closeSuggest(); }
  });
  suggest.addEventListener('mousedown', e => { const d = e.target.closest('[data-i]'); if (d) { e.preventDefault(); acceptSuggest(+d.dataset.i); } });
  sayBox.addEventListener('blur', () => setTimeout(closeSuggest, 150));

  meSelect.addEventListener('change', () => {
    me = meSelect.value; store.set('me', me);
    renderMe(); remarkAll(); refreshBadges();
  });
  onlyMine.addEventListener('change', () => document.body.classList.toggle('only-mine', onlyMine.checked));
  const menu = document.getElementById('menu');
  menu.addEventListener('click', () => {
    menu.setAttribute('aria-expanded', document.body.classList.toggle('menu-open'));
  });
  nav.addEventListener('click', e => { if (e.target.closest('a.motion')) document.body.classList.remove('menu-open'); });
  if (matchMedia('(max-width: 720px)').matches) sayBox.placeholder = 'Say something · @name · [[Page]]';

  // Tell the Motion this person is typing: at most every 3s while there is
  // text, and once when it is cleared or sent.
  let typingSent = 0;
  function sendTyping(on) {
    if (!viewer || !current) return;
    fetch('/api/motions/' + encodeURIComponent(current) + '/typing/', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrf() },
      body: JSON.stringify({ typing: on }),
    }).catch(() => {});
  }
  sayBox.addEventListener('input', () => {
    const now = Date.now();
    if (sayBox.value.trim()) {
      if (now - typingSent > 3000) { typingSent = now; sendTyping(true); }
    } else if (typingSent) { typingSent = 0; sendTyping(false); }
  });

  // Images into the composer: paste, drop, or the + button. Each is stored
  // first, then its markdown goes in at the caret.
  function showError(message) {
    const old = composer.querySelector('.err'); if (old) old.remove();
    composer.insertAdjacentHTML('beforeend', `<span class="err">${esc(message)}</span>`);
  }
  const fileInput = document.getElementById('file');
  async function upload(file) {
    const marker = `![uploading ${file.name || 'image'}…]()`;
    insertAtCaret(marker + '\n');
    try {
      const r = await fetch('/api/motions/' + encodeURIComponent(current) + '/media/', {
        method: 'POST', headers: { 'X-CSRFToken': csrf(), 'Content-Type': 'application/octet-stream' }, body: file,
      });
      const body = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(body.error || r.status);
      sayBox.value = sayBox.value.replace(marker, body.markdown);
    } catch (e) {
      sayBox.value = sayBox.value.replace(marker + '\n', '');
      showError('image: ' + e.message);
    }
    sayBox.dispatchEvent(new Event('input'));
  }
  function insertAtCaret(text) {
    const at = sayBox.selectionStart ?? sayBox.value.length;
    sayBox.value = sayBox.value.slice(0, at) + text + sayBox.value.slice(sayBox.selectionEnd ?? at);
    sayBox.selectionStart = sayBox.selectionEnd = at + text.length;
  }
  function imagesIn(list) { return [...(list || [])].filter(f => /^image\/(png|jpeg|gif|webp)$/.test(f.type)); }
  document.getElementById('attach').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => { imagesIn(fileInput.files).forEach(upload); fileInput.value = ''; });
  sayBox.addEventListener('paste', e => {
    const files = imagesIn([...(e.clipboardData?.items || [])].map(i => i.getAsFile()).filter(Boolean));
    if (files.length) { e.preventDefault(); files.forEach(upload); }
  });
  composer.addEventListener('dragover', e => { e.preventDefault(); composer.classList.add('dropping'); });
  composer.addEventListener('dragleave', () => composer.classList.remove('dropping'));
  composer.addEventListener('drop', e => {
    composer.classList.remove('dropping');
    const files = imagesIn(e.dataTransfer?.files);
    if (files.length) { e.preventDefault(); files.forEach(upload); }
  });

  function csrf() {
    const m = document.cookie.match(/(?:^|; )csrftoken=([^;]+)/);
    return m ? decodeURIComponent(m[1]) : '';
  }

  if (viewer) {
    document.body.classList.add('writer');
    auth.innerHTML = `writing as <b>${esc(viewer)}</b> · <a href="#" id="signout">sign out</a>`;
    document.getElementById('signout').addEventListener('click', async e => {
      e.preventDefault();
      await fetch('/api/auth/logout/', { method: 'POST', headers: { 'X-CSRFToken': csrf() } });
      location.reload();
    });
  } else {
    auth.innerHTML = '<span title="To write: run magenta.sh login on a machine with your SSH key">read-only</span>';
  }

  async function say() {
    const text = sayBox.value.trim();
    if (!text || !current) return;
    sendBtn.disabled = true;
    const old = composer.querySelector('.err'); if (old) old.remove();
    try {
      const r = await fetch('/api/motions/' + encodeURIComponent(current) + '/say/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrf() },
        body: JSON.stringify({ text }),
      });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status);
      sayBox.value = ''; typingSent = 0; sendTyping(false);
      await poll(false);
    } catch (e) {
      composer.insertAdjacentHTML('beforeend', `<span class="err">${esc(e.message)}</span>`);
    } finally {
      sendBtn.disabled = false;
      sayBox.focus();
    }
  }
  composer.addEventListener('submit', e => { e.preventDefault(); say(); });
  // Enter sends; Ctrl+Enter (or Shift+Enter) makes a new line. On a touch
  // screen there is no Ctrl, so Enter makes the new line and Send sends.
  const touchScreen = matchMedia('(pointer: coarse)').matches;
  sayBox.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;  // mid-composition (IME)
    if (e.ctrlKey || e.metaKey) {
      e.preventDefault(); insertAtCaret('\n'); sayBox.dispatchEvent(new Event('input')); return;
    }
    if (e.shiftKey || e.altKey || touchScreen) return;  // the textarea's own new line
    e.preventDefault(); say();
  });

  nav.addEventListener('click', e => {
    const a = e.target.closest('a.motion'); if (!a) return;
    e.preventDefault(); open(a.dataset.slug, true);
  });
  window.addEventListener('popstate', e => {
    const slug = (e.state && e.state.slug) || location.pathname.split('/')[2];
    if (slug) open(decodeURIComponent(slug), false);
  });

  (async function start() {
    try { await loadMotions(); } catch (e) { setStatus('cannot reach memory-lane', 'stale'); return; }
    const slug = initialSlug || (motions[0] && motions[0].slug);
    if (!slug) { inner.innerHTML = '<div class="empty">No Motions yet.</div>'; setStatus('live', 'live'); return; }
    await open(slug, false);
    setInterval(() => poll(false), POLL_MS);
  })();
})();
</script>
